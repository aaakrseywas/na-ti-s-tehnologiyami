<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>На «ты» с технологиями</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
  
</head>
<body>

<header>
    <a href="/">На «ты» с технологиями</a>

    <nav class="main-nav">
        <div class="nav-item has-menu">
            <a href="/" class="nav-link">Курс <span class="caret">▾</span></a>

            <div class="course-menu">
                <div class="course-menu-head">
                    <small>16 уроков</small>
                    <b>Программа курса</b>
                </div>
                <ol class="course-menu-list">
                    {% for num, title in all_lessons %}
                        <li>
                            <a href="/lesson/{{ num|int }}">
                                <span class="num">{{ num }}</span>
                                <span class="ttl">{{ title }}</span>
                            </a>
                        </li>
                    {% endfor %}
                </ol>
            </div>
        </div>
    </nav>
</header>

{% block content %}{% endblock %}

</body>
</html>
